[package]
name = "formatkit-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Reusable bounded compression, Huffman, RLE, PNG, PCX, TGA and optional DDS codecs"

[features]
default = ["dds"]
dds = ["dep:formatkit-pixel"]

[dependencies]
formatkit-core.workspace = true
formatkit-pixel = { workspace = true, optional = true }
lzma-rs = "0.3"
miniz_oxide = "0.8"
