[package]
name = "formatkit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Checked bytes, bits, sources, work budgets, checksums and shared binary values"
keywords = ["binary", "parsing", "checksum", "crc", "io"]
categories = ["parsing", "encoding"]

[features]
default = ["shift-jis"]
shift-jis = []

[dependencies]
thiserror.workspace = true
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
