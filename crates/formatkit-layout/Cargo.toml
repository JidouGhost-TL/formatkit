[package]
name = "formatkit-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Configured binary fields, records, tables, chunks, IFF/RIFF, charmaps and edits"
keywords = ["binary", "layout", "parsing", "iff", "charmap"]
categories = ["parsing", "encoding"]

[features]
default = ["std"]
# Host services (`std::io`, files, process-wide caches). Without it the crate
# is `no_std` + `alloc`.
std = ["formatkit-core/std"]

[dependencies]
formatkit-core = { workspace = true, features = ["shift-jis"] }

[dev-dependencies]
proptest = "1"
