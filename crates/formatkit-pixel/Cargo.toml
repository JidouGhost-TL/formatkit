[package]
name = "formatkit-pixel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Generic packed pixels, palettes, planar tiles, glyphs, Morton swizzle, atlases and S3TC"
keywords = ["pixel", "palette", "swizzle", "morton", "dxt"]
categories = ["graphics", "encoding"]

[features]
default = ["std"]
# Host services (`std::io`, files, process-wide caches). Without it the crate
# is `no_std` + `alloc`.
std = ["formatkit-core/std"]

[dependencies]
formatkit-core = { workspace = true, features = ["shift-jis"] }
