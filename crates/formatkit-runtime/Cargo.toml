[package]
name = "formatkit-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Explicit composition, resident writers and dispatch for owner-defined format modules"
keywords = ["format", "runtime", "dispatch", "modules", "binary"]
categories = ["parsing", "data-structures"]

[features]
default = ["std"]
# Host services (`std::io`, files, process-wide caches). Without it the crate
# is `no_std` + `alloc`.
std = ["formatkit-core/std", "formatkit-catalog/std"]

[dependencies]
formatkit-core = { workspace = true, features = ["shift-jis"] }
formatkit-catalog.workspace = true
