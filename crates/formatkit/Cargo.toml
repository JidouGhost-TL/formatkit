[package]
name = "formatkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Platform-neutral binary data toolkit"

[features]
default = []
pixel = ["dep:formatkit-pixel"]
codec = ["dep:formatkit-codec"]
corpus = ["dep:formatkit-corpus", "dep:formatkit-corpus-test"]

[dependencies]
formatkit-core.workspace = true
formatkit-layout.workspace = true
formatkit-catalog.workspace = true
formatkit-runtime.workspace = true
formatkit-pixel = { workspace = true, optional = true }
formatkit-codec = { workspace = true, optional = true }
formatkit-corpus = { workspace = true, optional = true }
formatkit-corpus-test = { workspace = true, optional = true }
